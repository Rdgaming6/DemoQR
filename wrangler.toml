name = "fluxqr-dynamic-qr-saas"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# Optional Cloudflare D1 Serverless SQLite Database Binding
# To create: npx wrangler d1 create fluxqr_db
# [[d1_databases]]
# binding = "DB"
# database_name = "fluxqr_db"
# database_id = "your-d1-database-id-here"

# Environment Variables for Cloudflare Pages Functions
# Configure in Cloudflare Pages Dashboard -> Settings -> Environment Variables
# [vars]
# SUPABASE_URL = "https://your-project.supabase.co"
# SUPABASE_ANON_KEY = "your-anon-key"
# APP_URL = "https://your-project.pages.dev"
